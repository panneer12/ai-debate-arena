name: Code Quality & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Check code formatting with Black
        run: |
          black --check --diff .
        continue-on-error: false
      
      - name: Check import sorting with isort
        run: |
          isort --check-only --diff .
        continue-on-error: false
      
      - name: Run PEP 8 checks with flake8
        run: |
          flake8 .
        continue-on-error: false

  test-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Create .env for tests
        run: |
          echo "GOOGLE_API_KEY=test_key_for_ci" > .env
          echo "GOOGLE_SEARCH_API_KEY=test_search_key" >> .env
          echo "GOOGLE_SEARCH_ENGINE_ID=test_engine_id" >> .env
      
      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
        continue-on-error: false
      
      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80
        continue-on-error: false
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Archive coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
