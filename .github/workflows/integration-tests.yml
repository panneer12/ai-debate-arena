name: Integration Tests

# Integration tests make real API calls and are expensive/slow.
# Run on main branch pushes/merges to ensure production-ready code.

on:
  # Run on push to main branch (after PR merge)
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration Tests (Real API Calls)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check if API key is configured
        run: |
          if [ -z "${{ secrets.GOOGLE_API_KEY }}" ]; then
            echo "❌ ERROR: GOOGLE_API_KEY secret not configured"
            echo "To run integration tests, add this secret in GitHub Settings:"
            echo "  Settings → Secrets and variables → Actions → New repository secret"
            echo "  Name: GOOGLE_API_KEY"
            echo "  Value: Your Google AI API key"
            exit 1
          fi
          echo "✅ API key configured"

      - name: Create .env with API credentials
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > .env

      - name: Run integration tests
        run: |
          pytest -m integration -v --tb=short
        continue-on-error: false  # Fail if integration tests fail

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            pytest_report.xml
            *.log
          retention-days: 14
